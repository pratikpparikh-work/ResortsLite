# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Server port — externalised to environment variable for cloud/container compatibility.
# Falls back to 8080 if PORT is not set (local development).
server.port=${PORT:8080}

# PostgreSQL 16 DataSource Configuration
# Connection parameters are externalised to environment variables / AWS Parameter Store
# to avoid hardcoded credentials in source code (fixes sec-cred-001, cr-java-0021).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings (HikariCP — Spring Boot default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JDBC initialisation — create schema on startup for development/testing
spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# External service endpoints — externalised to environment variables (fixes cr-java-0021, cr-java-0088).
# All endpoints use HTTPS to comply with cloud security standards (fixes cr-java-0088).
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}

# Report storage — externalised to environment variable for container compatibility (fixes czr-java-001).
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
